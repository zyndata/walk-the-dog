# Tool configuration only — this repo is a HA custom integration, not a Python package.

[tool.ruff]
target-version = "py314"
line-length = 100
# Don't reformat Python code blocks inside the docs — their comment alignment is deliberate
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
  "A",     # builtins shadowing
  "ASYNC", # async pitfalls (blocking calls in the event loop)
  "B",     # bugbear
  "C4",    # comprehensions
  "DTZ",   # naive datetimes — everything downstream of schedule.py is UTC
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "I",     # import sorting
  "N",     # naming
  "PERF",  # performance
  "PIE",
  "PL",    # pylint
  "PTH",   # pathlib only — project rule
  "RET",
  "RUF",
  "SIM",
  "T20",   # no print in integration code
  "UP",    # pyupgrade
  "W",
]

[tool.ruff.lint.per-file-ignores]
# Task-runner scripts talk to the developer on stdout
"scripts/*" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
