name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # hassfest and HACS rules change upstream without this repo changing — catch it early.
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
          # `hacsjson` and `integration_manifest` were ignored only because the action
          # reads repository files through the GitHub API and got nothing back while the
          # repo was private. It is public now, so both run for real.
          # `brands` stays ignored until the home-assistant/brands PR lands in phase 9.
          ignore: brands
