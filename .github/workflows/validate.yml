name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # hassfest and HACS rules change upstream without this repo changing — catch it early.
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
          # The repo is not in home-assistant/brands yet; the brands PR is
          # prepared in phase 7 and submitted in phase 9 — drop this then.
          ignore: brands
